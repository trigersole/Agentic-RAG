[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenwash-agentic-rag"
version = "0.1.0"
description = "Agentic RAG over the Greenwash sustainability-report knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "openai>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
greenwash-rag = "greenwash_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/greenwash_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

